workflows:
  android-release:
    name: Abu Elias Routine APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Generate Android project scaffolding
        script: flutter create --platforms=android --project-name abu_elias_routine .
      - name: Install dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
